name: Actualizar cooperación desde Kobo

on:
  workflow_dispatch:
  repository_dispatch:
    types: [kobo_envio]
  schedule:
    # Cada 30 minutos (minutos 7 y 37). GitHub puede retrasar u omitir ejecuciones programadas.
    - cron: "7,37 * * * *"

permissions:
  contents: write

# Evita que dos ejecuciones se crucen si una tarda más de lo normal.
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Actualizar data.json desde Kobo
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          # Segundo formulario (copia del principal). Opcional: si falla, se publica solo el principal.
          KOBO_ASSET_UID_2: ajfH3dzkqTkTcMnxr2gow3
          # Solo si el segundo formulario necesita una clave distinta; si no existe, se usa KOBO_TOKEN.
          KOBO_TOKEN_2: ${{ secrets.KOBO_TOKEN_2 }}
        run: python actualizar_datos.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Si solo cambió la hora de generación, no se guarda (evita un cambio cada 30 minutos sin datos nuevos).
          python - <<'PY'
          import json, subprocess, sys
          try:
              viejo = json.loads(subprocess.check_output(["git", "show", "HEAD:data.json"]))
          except Exception:
              sys.exit(0)
          nuevo = json.load(open("data.json", encoding="utf-8"))
          viejo.pop("generado", None); nuevo.pop("generado", None)
          if viejo == nuevo:
              subprocess.run(["git", "checkout", "--", "data.json"], check=True)
              print("Sin datos nuevos desde Kobo.")
          PY
          git add data.json
          if git diff --cached --quiet; then
            echo "No hay cambios en data.json"
          else
            git commit -m "Actualizar datos de cooperación desde Kobo"
            git push
          fi
